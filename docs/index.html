<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
		<title>Life.exe - Isometric</title>
		<style>
html, body {
	position: fixed;
	width: 100%;
	height: 100%;
	height: 100dvh;
	margin: 0;
	padding: 0;
	border: 0;
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	background-color: #030712;
	color: white;
}

input, textarea {
	font-size: 16px !important;
}

#canvas {
	position: fixed;
	top: 0;
	left: 0;
	width: 100vw !important;
	height: 100dvh !important;
	max-width: 100vw;
	max-height: 100dvh;
	display: block;
	margin: 0;
	padding: 0;
	border: 0;
	touch-action: none;
	outline: none;
}

#canvas:focus {
	outline: none;
}

#status {
	position: fixed;
	top: 0;
	left: 0;
	width: 100vw;
	height: 100dvh;
	background-color: #0b132a;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 22px;
	visibility: hidden;
	z-index: 100;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	transition: opacity 0.35s ease;
}

#status-splash {
	width: min(72vw, 300px);
	height: min(72vw, 300px);
	object-fit: contain;
	border-radius: 24px;
	image-rendering: -webkit-optimize-contrast;
	image-rendering: crisp-edges;
	filter: drop-shadow(0 0 28px rgba(0, 240, 255, 0.45));
	animation: cyberLogoFloat 3s ease-in-out infinite;
}

@keyframes cyberLogoFloat {
	0%, 100% {
		transform: translateY(0px) scale(1);
		filter: drop-shadow(0 0 24px rgba(0, 240, 255, 0.4));
	}
	50% {
		transform: translateY(-8px) scale(1.02);
		filter: drop-shadow(0 0 36px rgba(0, 240, 255, 0.7));
	}
}

#status-loading-box {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 12px;
	width: 90%;
	max-width: 440px;
}

#status-percent {
	font-size: 32px;
	font-weight: 800;
	color: #00f0ff;
	letter-spacing: 1.5px;
	text-shadow: 0 0 16px rgba(0, 240, 255, 0.65);
}

#status-progress-wrap {
	width: 100%;
	height: 18px;
	background: #060b18;
	border: 2px solid #0284c7;
	border-radius: 12px;
	overflow: hidden;
	padding: 2px;
	box-sizing: border-box;
	box-shadow: 0 0 20px rgba(2, 132, 199, 0.45), inset 0 2px 6px rgba(0,0,0,0.85);
}

#status-progress-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #0284c7, #00f0ff);
	border-radius: 8px;
	transition: width 0.12s ease-out;
	box-shadow: 0 0 12px #00f0ff;
}

#status-details {
	font-size: 16px;
	font-weight: 600;
	color: #bae6fd;
	letter-spacing: 0.6px;
	text-align: center;
	min-height: 24px;
	text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

#status-progress {
	display: none;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: inherit;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 101;
	display: none;
}

@keyframes cyberFadeIn {
	from { opacity: 0; transform: translateY(-14px) scale(0.96); }
	to { opacity: 1; transform: translateY(0) scale(1); }
}

.cyber-modal-card {
	animation: cyberFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

		<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="Life.exe">
			<div id="status-loading-box">
				<div id="status-percent">0%</div>
				<div id="status-progress-wrap">
					<div id="status-progress-fill"></div>
				</div>
				<div id="status-details">Loading assets...</div>
			</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// Ensure touch detection is present so Godot's web virtual keyboard (GodotDisplayVK) initializes
(function() {
	window.isMobileBrowser = function() {
		try {
			var ua = navigator.userAgent || '';
			var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Silk/i.test(ua);
			var isTouchMac = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
			var hasCoarse = window.matchMedia && (window.matchMedia('(pointer: coarse)').matches || window.matchMedia('(hover: none)').matches);
			var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
			return Boolean(isMobileUA || isTouchMac || hasCoarse || hasTouch);
		} catch(e) {
			return true;
		}
	};

	if (!('ontouchstart' in window) && (navigator.maxTouchPoints > 0 || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches))) {
		window.ontouchstart = null;
	}
})();
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":50538136,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
GODOT_CONFIG.experimentalVK = true;
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusPercent = document.getElementById('status-percent');
	const statusProgressFill = document.getElementById('status-progress-fill');
	const statusDetails = document.getElementById('status-details');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.style.opacity = '0';
			setTimeout(() => {
				statusOverlay.remove();
			}, 350);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					var pct = Math.min(100, Math.max(0, Math.floor((current / total) * 100)));
					if (statusPercent) statusPercent.textContent = pct + "%";
					if (statusProgressFill) statusProgressFill.style.width = pct + "%";

					var mbCurrent = (current / 1048576).toFixed(1);
					var mbTotal = (total / 1048576).toFixed(1);

					var detail = "Loading assets... (" + mbCurrent + " MB / " + mbTotal + " MB)";
					if (pct < 15) {
						detail = "Initializing game engine... (" + mbCurrent + " MB / " + mbTotal + " MB)";
					} else if (pct < 45) {
						detail = "Loading game scripts & data... (" + mbCurrent + " MB / " + mbTotal + " MB)";
					} else if (pct < 75) {
						detail = "Loading assets & sound effects... (" + mbCurrent + " MB / " + mbTotal + " MB)";
					} else if (pct < 95) {
						detail = "Loading isometric rooms & characters... (" + mbCurrent + " MB / " + mbTotal + " MB)";
					} else {
						detail = "Finalizing game world... (" + pct + "%)";
					}
					if (statusDetails) statusDetails.textContent = detail;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					if (statusPercent) statusPercent.textContent = "Loading...";
					if (statusDetails) statusDetails.textContent = "Connecting to game server...";
				}
			},
		}).then(() => {
			if (statusPercent) statusPercent.textContent = "100%";
			if (statusProgressFill) statusProgressFill.style.width = "100%";
			if (statusDetails) statusDetails.textContent = "Ready! Starting Life.exe...";
			setTimeout(() => {
				setStatusMode('hidden');
			}, 300);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
